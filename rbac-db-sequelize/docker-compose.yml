services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: rbac
      POSTGRES_PASSWORD: rbac
      POSTGRES_DB: rbac_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rbac -d rbac_test"]
      interval: 2s
      timeout: 3s
      retries: 30
